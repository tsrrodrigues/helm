<head>

<title>Helm Mobile</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
const VAPID_PUBLIC = 'BGOSNXNhlNEuYnQdDOWbPFH4r1OUC5EBBo4TBqxeWSZrBWFY6wo7fQmc5RxMbXXaQre7d8EmXt6_4KX-pCFxNEw';

async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))
      });
    }
    // Send subscription to daemon
    const proto = location.protocol;
    const host = location.hostname;
    await fetch(proto + '//' + host + ':7374/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON())
    });
    console.log('[helm] Push subscribed');
  } catch (e) {
    console.log('[helm] Push setup failed:', e);
  }
}
setupPush();
</script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a14;
  --surface: rgba(255,255,255,.03);
  --border: rgba(255,255,255,.07);
  --text: #ccc;
  --text-dim: #555;
  --text-muted: #3a3a5a;
  --accent-orange: #ffa502;
  --accent-green: #2ed573;
  --accent-blue: #63b3ed;
  --accent-purple: #6c63ff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ── App shell ──────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ── Views (routing) ────────────────────────── */
.view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.view.active { display: flex; }

/* ── Header ─────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { font-size: 18px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
.header-logo span { color: var(--accent-purple); }
.header-stats { display: flex; gap: 12px; align-items: center; }
.stat { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-dim); }
.stat strong { color: #888; font-weight: 700; }
.stat.waiting strong { color: var(--accent-orange); }
.stat .dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.green { background: var(--accent-green); box-shadow: 0 0 6px rgba(46,213,115,.5); }
.dot.orange { background: var(--accent-orange); box-shadow: 0 0 6px rgba(255,165,2,.5); }

.conn-status { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.conn-status.connected { color: var(--accent-green); background: rgba(46,213,115,.1); }
.conn-status.disconnected { color: #e05050; background: rgba(224,80,80,.1); }

/* ── Agent list ─────────────────────────────── */
.agent-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.agent-row {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,.03);
  border-left: 3px solid transparent;
  transition: background .15s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.agent-row:active { background: rgba(255,255,255,.04); }
.agent-row.is-wait { background: rgba(255,165,2,.02); }
.agent-row.expanded { background: rgba(255,255,255,.02); }
.agent-row.is-dismissed { opacity: .45; }

.agent-row.accent-0 { border-left-color: rgba(99,179,237,.5); }
.agent-row.accent-1 { border-left-color: rgba(183,148,244,.5); }
.agent-row.accent-2 { border-left-color: rgba(104,211,145,.5); }
.agent-row.accent-3 { border-left-color: rgba(251,191,36,.5); }
.agent-row.accent-4 { border-left-color: rgba(244,114,182,.5); }
.agent-row.accent-5 { border-left-color: rgba(103,216,239,.5); }
.agent-row.is-wait.accent-0 { border-left-color: rgba(99,179,237,.9); }
.agent-row.is-wait.accent-1 { border-left-color: rgba(183,148,244,.9); }
.agent-row.is-wait.accent-2 { border-left-color: rgba(104,211,145,.9); }
.agent-row.is-wait.accent-3 { border-left-color: rgba(251,191,36,.9); }
.agent-row.is-wait.accent-4 { border-left-color: rgba(244,114,182,.9); }
.agent-row.is-wait.accent-5 { border-left-color: rgba(103,216,239,.9); }

.agent-top { display: flex; align-items: center; gap: 10px; }

.glyph {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; position: relative;
}
.glyph.g-0 { background: rgba(99,179,237,.12); color: #63b3ed; }
.glyph.g-1 { background: rgba(183,148,244,.12); color: #b794f4; }
.glyph.g-2 { background: rgba(104,211,145,.12); color: #68d391; }
.glyph.g-3 { background: rgba(251,191,36,.12); color: #fbbf24; }
.glyph.g-4 { background: rgba(244,114,182,.12); color: #f687b3; }
.glyph.g-5 { background: rgba(103,216,239,.12); color: #67d8ef; }

.glyph .sdot {
  position: absolute; bottom: -2px; right: -2px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--bg);
}
.sdot.run { background: var(--accent-green); }
.sdot.wait { background: var(--accent-orange); box-shadow: 0 0 5px rgba(255,165,2,.5); }

.agent-info { flex: 1; min-width: 0; }
.agent-meta { display: flex; align-items: baseline; gap: 0; margin-bottom: 2px; }
.agent-project { font-size: 12px; font-weight: 800; letter-spacing: -.02em; }
.agent-project.c-0 { color: #63b3ed; }
.agent-project.c-1 { color: #b794f4; }
.agent-project.c-2 { color: #68d391; }
.agent-project.c-3 { color: #fbbf24; }
.agent-project.c-4 { color: #f687b3; }
.agent-project.c-5 { color: #67d8ef; }
.agent-sep { color: #333; margin: 0 6px; font-size: 10px; }
.agent-task { font-size: 12px; font-weight: 600; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-time { font-size: 11px; color: #444; margin-left: auto; flex-shrink: 0; font-variant-numeric: tabular-nums; padding-left: 8px; }
.agent-output {
  font-size: 11px; color: var(--text-muted);
  font-family: 'SF Mono','Menlo',monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -.02em;
}
.agent-row.is-wait .agent-output { color: #666; }
.ch { margin-right: 3px; }
.ch.wait { color: #b07820; }
.ch.run { color: var(--text-muted); }

/* ── Expanded card ──────────────────────────── */
.response-card { display: none; margin-top: 12px; animation: rc-in 150ms ease-out; }
.agent-row.expanded .response-card { display: block; }
@keyframes rc-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

.rc-hero { padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; }
.rc-hero.question { background: rgba(255,165,2,.06); border: 1px solid rgba(255,165,2,.15); }
.rc-hero.response { background: rgba(99,179,237,.04); border: 1px solid rgba(99,179,237,.1); }
.rc-hero.permission { background: rgba(239,68,68,.05); border: 1px solid rgba(239,68,68,.15); }
.rc-hero-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-bottom: 6px; }
.rc-hero.question .rc-hero-label { color: #b07820; }
.rc-hero.response .rc-hero-label { color: #4a7a9a; }
.rc-hero.permission .rc-hero-label { color: #a04040; }
.rc-hero-text { font-size: 13px; font-weight: 600; line-height: 1.45; }
.rc-hero.question .rc-hero-text { color: #e0c090; }
.rc-hero.response .rc-hero-text { color: #b0cfe0; }
.rc-hero.permission .rc-hero-text { color: #e08080; }

/* Summary list in cards */
.rc-summary-list {
  display: flex; flex-direction: column; gap: 6px;
}
.rc-summary-item {
  font-size: 12px; color: #bbb; line-height: 1.4;
  padding-left: 14px; position: relative;
}
.rc-summary-item::before {
  content: '›';
  position: absolute; left: 0;
  color: #ffa502; font-weight: 700;
}

.rc-command {
  margin-top: 8px; padding: 8px 10px;
  background: rgba(0,0,0,.3); border-radius: 6px;
  font-family: 'SF Mono','Menlo',monospace;
  font-size: 11px; color: #aaa; overflow-x: auto;
  border: 1px solid rgba(255,255,255,.04);
}

.rc-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; margin-top: 10px; }
.rc-option {
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 10px; padding: 12px 14px;
  cursor: pointer; transition: all .12s;
  display: flex; align-items: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
.rc-option:active { background: rgba(255,255,255,.06); transform: scale(.98); }
.opt-num {
  font-size: 10px; font-weight: 700; color: #555;
  background: rgba(255,255,255,.06); border-radius: 4px;
  padding: 2px 6px; font-family: 'SF Mono','Menlo',monospace; flex-shrink: 0;
}
.opt-label { font-size: 13px; font-weight: 600; color: #ddd; }
.rc-option.rc-approve .opt-label { color: #68d391; }
.rc-option.rc-deny .opt-label { color: #e05050; }
.rc-option.selected { border-color: rgba(46,213,115,.5); background: rgba(46,213,115,.08); }
.rc-option.selected .opt-label { color: var(--accent-green); }
.rc-option.selected .opt-label::after { content: ' ✓'; }

.rc-keywords { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.rc-kw {
  padding: 2px 7px; border-radius: 4px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
  font-size: 10px; font-weight: 600; color: #777;
  font-family: 'SF Mono','Menlo',monospace;
}

.rc-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.05); }
.rc-btn {
  flex: 1; font-size: 12px; font-weight: 600; padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03);
  color: #777; cursor: pointer; text-align: center;
  -webkit-tap-highlight-color: transparent; transition: all .12s;
}
.rc-btn:active { transform: scale(.97); }
.rc-btn.primary { color: var(--accent-purple); border-color: rgba(108,99,255,.3); background: rgba(108,99,255,.08); }
.rc-btn.danger { color: #e05050; border-color: rgba(224,80,80,.2); background: rgba(224,80,80,.05); flex: 0.6; }

.write-area { display: none; margin-top: 10px; animation: rc-in 120ms ease-out; }
.write-area.visible { display: block; }
.write-input {
  width: 100%; background: rgba(0,0,0,.3);
  border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
  padding: 10px 12px; font-size: 14px; color: var(--text);
  font-family: inherit; outline: none; resize: none;
  min-height: 44px; line-height: 1.4; -webkit-appearance: none;
}
.write-input::placeholder { color: #444; }
.write-input:focus { border-color: rgba(108,99,255,.4); }
.write-submit { display: flex; justify-content: flex-end; margin-top: 8px; }

@keyframes sent-flash { 0% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.sent-indicator {
  font-size: 12px; color: var(--accent-green); font-weight: 600;
  padding: 12px 14px; animation: sent-flash 1s ease-out forwards; animation-delay: .4s;
}

/* ── Bottom input bar ───────────────────────── */
.bottom-bar {
  flex-shrink: 0; border-top: 1px solid var(--border);
  background: rgba(10,10,20,.98); padding: 10px 12px;
  display: flex; gap: 8px; align-items: flex-end;
}
.bottom-input-wrap { flex: 1; }
.bottom-target { font-size: 10px; color: var(--text-dim); padding: 0 4px 6px; white-space: nowrap; }
.bottom-target strong { color: var(--accent-orange); }
.bottom-input {
  width: 100%; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
  padding: 10px 16px; font-size: 15px; color: var(--text);
  font-family: inherit; outline: none; resize: none;
  min-height: 42px; max-height: 120px; line-height: 1.4; -webkit-appearance: none;
}
.bottom-input::placeholder { color: #444; }
.bottom-input:focus { border-color: rgba(108,99,255,.3); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent-purple); border: none; color: #fff;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: transform .1s, opacity .1s;
}
.send-btn:active { transform: scale(.9); }
.send-btn:disabled { opacity: .3; }

/* ── Empty state ────────────────────────────── */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-dim); gap: 8px; padding: 40px;
}
.empty-state .icon { font-size: 48px; opacity: .3; }
.empty-state .msg { font-size: 14px; text-align: center; }

/* ══════════════════════════════════════════════
   TERMINAL VIEW (full-screen route)
   ══════════════════════════════════════════════ */
.term-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.term-back {
  font-size: 22px; color: var(--accent-purple); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  padding: 0 4px;
  font-weight: 300;
}
.term-back:active { opacity: .5; }
.term-title-wrap { flex: 1; min-width: 0; }
.term-title { font-size: 14px; font-weight: 700; color: #ddd; }
.term-subtitle { font-size: 11px; color: var(--text-dim); }
.term-status-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.term-status-dot.run { background: var(--accent-green); box-shadow: 0 0 6px rgba(46,213,115,.5); }
.term-status-dot.wait { background: var(--accent-orange); box-shadow: 0 0 6px rgba(255,165,2,.5); }

.term-output-wrap {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
}
.term-output {
  font-family: 'SF Mono','Menlo','Courier New',monospace;
  font-size: 14px; color: #bbb; line-height: 1.6;
  user-select: text; -webkit-user-select: text;
  white-space: pre-wrap; word-break: break-word;
}
/* Terminal syntax highlighting */
.term-output .t-dim { color: #444; }
.term-output .t-section {
  color: #fff; font-weight: 700;
  display: block; margin: 8px 0 4px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.term-output .t-success { color: #2ed573; }
.term-output .t-error { color: #ff4757; font-weight: 600; }
.term-output .t-diff-add { color: #2ed573; background: rgba(46,213,115,.06); display: block; padding: 1px 4px; border-radius: 2px; }
.term-output .t-diff-del { color: #ff6b81; background: rgba(255,107,129,.06); display: block; padding: 1px 4px; border-radius: 2px; }
.term-output .t-diff-header { color: #63b3ed; font-weight: 600; display: block; margin-top: 6px; }
.term-output .t-prompt { color: var(--accent-purple); font-weight: 700; display: block; margin-top: 8px; }
.term-output .t-activity { color: #63b3ed; }
.term-output .t-test-pass { color: #2ed573; padding-left: 8px; }
/* Flowchart (converted from ASCII art) */
.t-flow {
  display: flex; flex-direction: column; align-items: center;
  gap: 0; margin: 8px 0; padding: 8px 0;
}
.t-flow-box {
  padding: 8px 16px;
  background: rgba(108,99,255,.08);
  border: 1px solid rgba(108,99,255,.25);
  border-radius: 8px;
  color: #ddd; font-size: 13px; font-weight: 600;
  text-align: center;
  max-width: 90%;
  word-break: break-word;
}
.t-flow-arrow {
  color: #555; font-size: 12px; padding: 4px 0;
  display: flex; align-items: center; gap: 4px;
}

/* Table rows (converted from ASCII tables) */
.t-table-row {
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 10px; margin: 4px 0;
  background: rgba(255,255,255,.03);
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.05);
}
.t-table-cell {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.t-cell-label {
  font-size: 11px; color: #666; font-weight: 600; flex-shrink: 0;
}
.t-cell-value {
  font-size: 13px; color: #ccc; font-weight: 600; text-align: right;
}

.term-output .t-question {
  color: #ffa502; font-weight: 600;
  display: block; margin-top: 6px;
  padding: 6px 8px;
  background: rgba(255,165,2,.06);
  border-radius: 6px;
  border: 1px solid rgba(255,165,2,.12);
}

.term-input-bar {
  flex-shrink: 0; border-top: 1px solid var(--border);
  background: rgba(10,10,20,.98); padding: 10px 12px;
  display: flex; gap: 8px; align-items: flex-end;
}
.term-input {
  flex: 1; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
  padding: 10px 12px; font-size: 14px; color: var(--text);
  font-family: 'SF Mono','Menlo',monospace;
  outline: none; resize: none; min-height: 42px; max-height: 120px;
  line-height: 1.4; -webkit-appearance: none;
}
.term-input::placeholder { color: #444; }
.term-input:focus { border-color: rgba(108,99,255,.4); }
.term-send {
  width: 42px; height: 42px; border-radius: 8px;
  background: var(--accent-purple); border: none; color: #fff;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: transform .1s;
}
.term-send:active { transform: scale(.9); }

/* Quick actions bar in terminal view */
.term-quick {
  display: flex; gap: 6px; padding: 8px 12px 0;
  margin-top: 6px;
  flex-shrink: 0; overflow-x: auto;
  border-top: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}
.term-quick::-webkit-scrollbar { display: none; }
.term-quick-btn {
  font-size: 11px; font-weight: 600;
  padding: 5px 12px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03);
  color: #888; cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.term-quick-btn:active { background: rgba(255,255,255,.08); }
.term-quick-btn.green { color: #68d391; border-color: rgba(46,213,115,.2); }
.term-quick-btn.red { color: #e05050; border-color: rgba(224,80,80,.15); }

/* ── Blink ──────────────────────────────────── */
.blink-dim .sdot.wait, .blink-dim .term-status-dot.wait { opacity: .3; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
</style>

<body>

<div class="app">

  <!-- ══ VIEW: LIST ══════════════════════════════ -->
  <div class="view active" id="view-list">
    <div class="header">
      <div class="header-left">
        <div class="header-logo"><span>⎈</span> Helm</div>
        <div class="conn-status disconnected" id="conn-status">offline</div>
      </div>
      <div class="header-stats">
        <div class="stat"><div class="dot green"></div><strong id="stat-agents">0</strong></div>
        <div class="stat waiting"><div class="dot orange"></div><strong id="stat-waiting">0</strong></div>
      </div>
    </div>

    <div class="agent-list" id="agent-list">
      <div class="empty-state" id="empty-state">
        <div class="icon">⎈</div>
        <div class="msg">Nenhum agente ativo<br><span style="font-size:12px;color:#333">Conecte ao daemon para monitorar</span></div>
      </div>
    </div>

<!-- bottom bar removed: input is in expanded card -->
  </div>

  <!-- ══ VIEW: TERMINAL ═════════════════════════ -->
  <div class="view" id="view-terminal">
    <div class="term-header">
      <div class="term-back" id="term-back">‹</div>
      <div class="term-title-wrap">
        <div class="term-title" id="term-title">agente</div>
        <div class="term-subtitle" id="term-subtitle">projeto</div>
      </div>

const GLYPHS = ['⚙', '⚡', '◆', '★', '■', '△', '⚒', '☷', '✦', '✱'];

function projectColor(n) {
  if (!n) return 0;
  let h = 0;
  for (let i = 0; i < n.length; i++) h = ((h << 5) - h + n.charCodeAt(i)) | 0;
  return ((h % 6) + 6) % 6;
}

function glyphFor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
  return GLYPHS[((h % GLYPHS.length) + GLYPHS.length) % GLYPHS.length];
}

function stripAnsi(str) {
  return str
    .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
    .replace(/\x1b\][^\x07]*\x07/g, '')
    .replace(/\x1b[^[\]]/g, '')
    .replace(/[\x00-\x08\x0e-\x1f]/g, '');
}

function parseAsciiTable(lines) {
  // Detect and convert ASCII box-drawing tables to mobile-friendly format
  const rows = [];
  let headers = [];
  for (const line of lines) {
    const t = line.trim();
    // Skip border lines (┌─┬┐├─┼┤└─┴┘ and plain --- variants)
    if (/^[┌┬┐├┼┤└┴┘─│+\-|=\s]+$/.test(t)) continue;
    // Extract cell content from │ delimited rows
    if (/│/.test(t) || (/\|/.test(t) && t.split('|').length >= 3)) {
      const sep = /│/.test(t) ? '│' : '|';
      const cells = t.split(sep).map(c => c.trim()).filter(c => c !== '');
      if (cells.length > 0) {
        if (!headers.length) headers = cells;
        else rows.push(cells);
      }
    }
  }
  if (!headers.length && !rows.length) return null;
  
  let html = '';
  for (const row of rows) {
    html += '<div class="t-table-row">';
    row.forEach((cell, i) => {
      const label = headers[i] || '';
      html += `<div class="t-table-cell"><span class="t-cell-label">${esc(label)}</span><span class="t-cell-value">${esc(cell)}</span></div>`;
    });
    html += '</div>';
  }
  // If only headers, show them as a single row
  if (!rows.length && headers.length) {
    html += '<div class="t-table-row">';
    headers.forEach(h => {
      html += `<div class="t-table-cell"><span class="t-cell-value">${esc(h)}</span></div>`;
    });
    html += '</div>';
  }
  return html;
}

function parseAsciiFlowchart(lines) {
  // Extract box contents from ASCII art flowcharts
  // Boxes: ┌──┐ │text│ └──┘ or +--+ |text| +--+
  const boxes = [];
  const arrows = []; // arrow labels between boxes
  
  for (const line of lines) {
    const t = line.trim();
    // Skip border/arrow-only lines
    if (/^[┌┬┐├┼┤└┴┘─│+\-|=\s►▶→←▼▲↓↑╭╮╰╯╔╗╚╝═║]*$/.test(t) && !/[a-zA-Z0-9À-ú]/.test(t)) continue;
    
    // Extract text from box lines: │ text │ or | text |
    const boxMatch = t.match(/[│|]\s*(.+?)\s*[│|]/);
    if (boxMatch) {
      const content = boxMatch[1].trim();
      // Skip if it's just dashes or arrows
      if (content && !/^[-─═>►▶→←]+$/.test(content)) {
        // Avoid duplicates (multi-line boxes)
        if (!boxes.length || boxes[boxes.length - 1] !== content) {
          boxes.push(content);
        }
      }
      continue;
    }
    
    // Arrow labels (text between boxes, like "──▶ label" or just text on arrow lines)
    const arrowLabel = t.replace(/[─━═►▶→←▼▲↓↑|│┌┐└┘+\-]/g, '').trim();
    if (arrowLabel && arrowLabel.length > 1 && arrowLabel.length < 40) {
      arrows.push(arrowLabel);
    }
  }
  
  if (boxes.length < 2) return null;
  
  let html = '<div class="t-flow">';
  boxes.forEach((box, i) => {
    html += `<div class="t-flow-box">${esc(box)}</div>`;
    if (i < boxes.length - 1) {
      const label = arrows[i] || '';
      html += `<div class="t-flow-arrow">${label ? esc(label) + ' ' : ''}↓</div>`;
    }
  });
  html += '</div>';
  return html;
}

function formatTermOutput(raw) {
  const clean = stripAnsi(raw);
  const allLines = clean.split('\n');
  
  // First pass: find table blocks and convert them
  const chunks = []; // { type: 'lines'|'table', content }
  let buf = [];
  let inTable = false;
  
  for (const line of allLines) {
    const t = line.trim();
    const isTableLine = /[┌┬┐├┼┤└┴┘│]/.test(t) || (/^\|.*\|/.test(t) && t.split('|').length >= 3);
    const isBorderOnly = /^[┌┬┐├┼┤└┴┘─│+\-|=\s]+$/.test(t);
    
    if (isTableLine || isBorderOnly) {
      if (!inTable && buf.length) {
        chunks.push({ type: 'lines', content: buf });
        buf = [];
      }
      inTable = true;
      buf.push(line);
    } else {
      if (inTable && buf.length) {
        chunks.push({ type: 'table', content: buf });
        buf = [];
      }
      inTable = false;
      buf.push(line);
    }
  }
  if (buf.length) chunks.push({ type: inTable ? 'table' : 'lines', content: buf });
  
  // Second pass: render each chunk
  let result = '';
  for (const chunk of chunks) {
    if (chunk.type === 'table') {
      // Check if it's a flowchart (has arrows: ►▶→── connecting boxes)
      const joined = chunk.content.join('\n');
      const hasArrows = /[►▶→←]|──+[>►▶]|──+\s*\n/.test(joined);
      const hasMultipleBoxes = (joined.match(/[┌╭╔+]\s*[─━═\-]/g) || []).length >= 2;
      
      if (hasArrows || hasMultipleBoxes) {
        const flowHtml = parseAsciiFlowchart(chunk.content);
        if (flowHtml) { result += flowHtml; continue; }
      }
      
      const tableHtml = parseAsciiTable(chunk.content);
      if (tableHtml) { result += tableHtml; continue; }
    }
    // Regular lines — filter noise
    const lines = chunk.content.filter(l => {
      const t = l.trim();
      if (!t) return false;
      if (/^[─━═\s]+$/.test(t)) return false;
      if (/^⏵/.test(t)) return false;
      if (/bypass permissions on/i.test(t)) return false;
      if (/ctrl\+[a-z] to /i.test(t)) return false;
      if (/esc to interrupt/i.test(t)) return false;
      if (/shift\+tab to cycle/i.test(t)) return false;
      return true;
    });
  
    const formatted = lines.map(line => {
    const trimmed = line.trim();
    const escaped = esc(line);
    
    // Empty lines (should be filtered already, but just in case)
    if (!trimmed) return '';
    
    // Claude Code section headers (⏺ Reading..., ⏺ Writing...)
    if (/^⏺/.test(trimmed))
      return '<span class="t-section">' + escaped + '</span>';
    
    // Success markers (✓ Read file, ✓ Wrote file)
    if (/^✓/.test(trimmed))
      return '<span class="t-success">' + escaped + '</span>';
    
    // Error/failure markers
    if (/^✗|^ERROR|^Error:|FAIL/i.test(trimmed))
      return '<span class="t-error">' + escaped + '</span>';
    
    // Diff: added lines
    if (/^\+\s/.test(trimmed) || /^\+[^+]/.test(trimmed))
      return '<span class="t-diff-add">' + escaped + '</span>';
    
    // Diff: removed lines
    if (/^-\s/.test(trimmed) || /^-[^-]/.test(trimmed))
      return '<span class="t-diff-del">' + escaped + '</span>';
    
    // Diff: file headers
    if (/^---\s|^\+\+\+\s|^diff\s/.test(trimmed))
      return '<span class="t-diff-header">' + escaped + '</span>';
    
    // Prompt lines (>, ❯, $)
    if (/^[>❯$]\s*$/.test(trimmed))
      return '<span class="t-prompt">' + escaped + '</span>';
    
    // Spinners / activity
    if (/[✻⠋⠙⠸⠴⠦⠇◆]/.test(trimmed))
      return '<span class="t-activity">' + escaped + '</span>';
    
    // Test results
    if (/^\s*[✓✔]\s/.test(trimmed))
      return '<span class="t-test-pass">' + escaped + '</span>';
    
    // File paths and commands (lines with ── separators)  
    if (/^[─━═]+/.test(trimmed) || /^⏵/.test(trimmed))
      return '<span class="t-dim">' + escaped + '</span>';
    
    // Permission/question prompts
    if (/\(y\/n\)|accept edits|shift\+tab|How should|Do you want/i.test(trimmed))
      return '<span class="t-question">' + escaped + '</span>';
    
    // Default
    return escaped;
  });
    
    result += formatted.join('\n') + '\n';
  }
  return result;
}

let termRefreshInterval = null;
async function refreshTerminal() {
  if (!state.terminalPane) return;
  // Skip refresh if user has text selected (don't kill their selection)
  const sel = window.getSelection();
  if (sel && sel.toString().length > 0) return;
  try {
    const r = await fetch(API_URL + '/pane-output?paneId=' + encodeURIComponent(state.terminalPane));
    if (!r.ok) return;
    const data = await r.json();
    const outputEl = document.getElementById('term-output');
    const wrap = document.getElementById('term-output-wrap');
    const wasAtBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 30;
    outputEl.innerHTML = formatTermOutput(data.output || '');
    if (wasAtBottom) wrap.scrollTop = wrap.scrollHeight;
  } catch {}
  // Update status dot
  const found = findAgent(state.terminalPane);
  if (found) {
    document.getElementById('term-dot').className = 'term-status-dot ' + (found.agent.status === 'waiting' ? 'wait' : 'run');
  }
}

function startTermRefresh() {
  stopTermRefresh();
  termRefreshInterval = setInterval(refreshTerminal, 3000);
}
function stopTermRefresh() {
  if (termRefreshInterval) { clearInterval(termRefreshInterval); termRefreshInterval = null; }
}

// ── WebSocket ───────────────────────────────────────
let ws = null;

// Notify server user is active — unlocks next push notification
function ackPush() {
  fetch(API_URL + '/push-ack', { method: 'POST' }).catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') ackPush();
});

function connect() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      state.connected = true;
      connEl.textContent = 'online';
      connEl.className = 'conn-status connected';
      ackPush();  // user opened app — clear pending notification
    };
    ws.onmessage = (e) => {
      try {
        const next = JSON.parse(e.data);
        // Clear dismiss for panes that left waiting (agent resumed)
        for (const paneId of state.dismissedPanes) {
          let stillWaiting = false;
          for (const f of (next.fronts || []))
            for (const a of f.agents)
              if (a.paneId === paneId && a.status === 'waiting') stillWaiting = true;
          if (!stillWaiting) state.dismissedPanes.delete(paneId);
        }
        state.data = next;
        renderList();
        updateTerminalView();
      } catch {}
    };
    ws.onclose = (e) => {
      state.connected = false;
      connEl.textContent = 'offline';
      connEl.className = 'conn-status disconnected';
      console.log('[helm-mobile] WS closed:', e.code, e.reason);
      setTimeout(connect, 3000);
    };
    ws.onerror = (e) => {
      console.log('[helm-mobile] WS error:', e);
      connEl.textContent = WS_URL.slice(0,30);
      ws.close();
    };
  } catch {
    state.data = DEMO_DATA;
    renderList();
  }
}

async function killAgent(paneId) {
  if (!state.connected) { console.log('[demo] kill:', paneId); return; }
  try {
    await fetch(API_URL + '/kill-agent', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paneId })
    });
  } catch (e) { console.log('[helm] kill failed:', e); }
}

async function sendKeys(paneId, text) {
  if (!state.connected) { console.log('[demo] send-keys:', paneId, text); return true; }
  try {
    const r = await fetch(API_URL + '/send-keys', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paneId, text })
    });
    return r.ok;
  } catch { return false; }
}

// ── Render list ─────────────────────────────────────
function renderList() {
  const { fronts, summary } = state.data;
  document.getElementById('stat-agents').textContent = summary?.totalAgents || 0;
  // Count effective waiting (exclude dismissed)
  let effectiveWaiting = 0;
  for (const f of (fronts || []))
    for (const a of f.agents)
      if (a.status === 'waiting' && !state.dismissedPanes.has(a.paneId)) effectiveWaiting++;
  document.getElementById('stat-waiting').textContent = effectiveWaiting;

  const allAgents = [];
  for (const f of (fronts || []))
    for (const a of f.agents)
      allAgents.push({ agent: a, front: f });

  if (!allAgents.length) {
    emptyEl.style.display = '';
    listEl.querySelectorAll('.agent-row').forEach(el => el.remove());
    updateBottomBar();
    return;
  }
  emptyEl.style.display = 'none';

  // Build fresh list (simple, no duplication bugs)
  const existingPanes = new Set();
  listEl.querySelectorAll('.agent-row').forEach(el => existingPanes.add(el.dataset.pane));

  // Remove all existing rows and rebuild
  listEl.querySelectorAll('.agent-row').forEach(el => el.remove());

  allAgents.forEach(({ agent, front }) => {
    const row = buildRow(agent, front);
    listEl.appendChild(row);
  });

  updateBottomBar();
}

function buildRow(agent, front) {
  const row = document.createElement('div');
  row.dataset.pane = agent.paneId;

  const isWait = agent.status === 'waiting';
  const isExpanded = state.expandedPane === agent.paneId;
  const ci = projectColor(front.projectDir);
  const g = glyphFor(agent.paneId);
  const project = (front.projectDir || front.sessionName || '').split('/').pop();
  const statusChar = isWait ? '❯' : '✱';
  const statusClass = isWait ? 'wait' : 'run';
  const rawOutput = isWait
    ? (agent.waitingSummary?.split('\n')[0]?.replace(/^[•\-]\s*/, '') || cleanOutput(agent.lastOutput) || 'aguardando')
    : (cleanOutput(agent.lastOutput) || 'trabalhando...');
  const output = rawOutput;

  const isDismissed = isWait && state.dismissedPanes.has(agent.paneId);
  row.className = 'agent-row accent-' + ci + (isWait ? ' is-wait' : '') + (isExpanded ? ' expanded' : '') + (isDismissed ? ' is-dismissed' : '');

  let cardHtml = '';
  if (isExpanded) cardHtml = buildCard(agent, front);

  row.innerHTML = `
    <div class="agent-top">
      <div class="glyph g-${ci}">${g}<span class="sdot ${isWait?'wait':'run'}"></span></div>
      <div class="agent-info">
        <div class="agent-meta">
          <span class="agent-project c-${ci}">${esc(project)}</span>
          <span class="agent-sep">›</span>
          <span class="agent-task">${esc(agent.task || agent.windowName)}</span>
          <span class="agent-time">${elapsed(agent.interactionStartedAt)}</span>
        </div>
        <div class="agent-output"><span class="ch ${statusClass}">${statusChar}</span> ${esc(output)}</div>
      </div>
    </div>
    <div class="response-card">${cardHtml}</div>
  `;

  // Row click — expand/collapse
  row.addEventListener('click', (e) => {
    if (e.target.closest('.rc-option, .rc-btn, .write-input')) return;
    const pane = row.dataset.pane;
    if (state.expandedPane === pane) {
      // Collapsing — dismiss if waiting
      const ag = findAgent(pane);
      if (ag && ag.agent.status === 'waiting') {
        state.dismissedPanes.add(pane);
      }
      state.expandedPane = null;
      state.selectedPane = null;
    } else {
      state.expandedPane = pane;
      state.selectedPane = pane;
    }
    renderList();
  });

  // Bind card events
  if (isExpanded) bindCardEvents(row, agent);

  return row;
}

function buildCard(agent, front) {
  const rc = agent.responseCard;
  const isWait = agent.status === 'waiting';
  let html = '';

  if (rc) {
    if (rc.type === 'question' && rc.options?.length) {
      html += `<div class="rc-hero question">
        <div class="rc-hero-label">pergunta</div>
        <div class="rc-hero-text">${esc(rc.hero)}</div>
      </div>
      <div class="rc-options">
        ${rc.options.map((o,i) => `
          <div class="rc-option" data-text="${esc(o.label)}">
            <span class="opt-num">${i+1}</span>
            <span class="opt-label">${esc(o.label)}</span>
          </div>
        `).join('')}
      </div>`;
    } else if (rc.type === 'permission') {
      html += `<div class="rc-hero permission">
        <div class="rc-hero-label">permissão</div>
        <div class="rc-hero-text">${esc(rc.hero)}</div>
        ${rc.command ? `<div class="rc-command"><code>${esc(rc.command)}</code></div>` : ''}
      </div>
      <div class="rc-options">
        <div class="rc-option rc-approve" data-text="y">
          <span class="opt-num">1</span><span class="opt-label">Aprovar</span>
        </div>
        <div class="rc-option rc-deny" data-text="n">
          <span class="opt-num">2</span><span class="opt-label">Negar</span>
        </div>
      </div>`;
    } else {
      html += `<div class="rc-hero response">
        <div class="rc-hero-label">resposta</div>
        <div class="rc-hero-text">${esc(rc.hero)}</div>
      </div>`;
    }
    if (rc.keywords?.length) {
      html += `<div class="rc-keywords">${rc.keywords.map(k => `<span class="rc-kw">${esc(k)}</span>`).join('')}</div>`;
    }
  } else {
    if (isWait) {
      // Parse waitingSummary bullets into structured list
      const summary = agent.waitingSummary || '';
      const bullets = summary.split('\n').map(l => l.replace(/^[•\-]\s*/, '').trim()).filter(Boolean);
      if (bullets.length > 0) {
        html += `<div class="rc-hero question">
          <div class="rc-hero-label">aguardando resposta</div>
          <div class="rc-summary-list">
            ${bullets.map(b => `<div class="rc-summary-item">${esc(b)}</div>`).join('')}
          </div>
        </div>`;
      } else {
        html += `<div class="rc-hero question">
          <div class="rc-hero-label">aguardando resposta</div>
          <div class="rc-hero-text">Agente parou e aguarda sua interação</div>
        </div>`;
      }
    } else {
      const text = cleanOutput(agent.lastOutput) || 'Trabalhando...';
      html += `<div class="rc-hero response">
        <div class="rc-hero-label">em progresso</div>
        <div class="rc-hero-text">${esc(text)}</div>
      </div>`;
    }
  }

  // Write area
  html += `<div class="write-area" id="wa-${agent.paneId}">
    <textarea class="write-input" placeholder="Instrução..." rows="2"></textarea>
    <div class="write-submit"><button class="rc-btn primary" data-action="inline-send">Enviar</button></div>
  </div>`;

  html += `<div class="rc-actions">
    <button class="rc-btn" data-action="terminal">Terminal ↗</button>
    <button class="rc-btn primary" data-action="write">Escrever</button>
    <button class="rc-btn danger" data-action="kill">Encerrar</button>
  </div>`;

  return html;
}

function bindCardEvents(row, agent) {
  const paneId = row.dataset.pane;

  row.querySelectorAll('.rc-option').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      opt.classList.add('selected');
      sendKeys(paneId, opt.dataset.text);
      showSent(row);
    });
  });

  row.querySelector('[data-action="terminal"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    openTerminal(paneId);
  });

  row.querySelector('[data-action="kill"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!confirm('Encerrar este agente?')) return;
    killAgent(paneId);
    row.style.opacity = '0.3';
    setTimeout(() => { state.expandedPane = null; state.selectedPane = null; renderList(); }, 1000);
  });

  row.querySelector('[data-action="write"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const wa = row.querySelector('.write-area');
    wa?.classList.toggle('visible');
    if (wa?.classList.contains('visible')) wa.querySelector('.write-input')?.focus();
  });

  row.querySelector('[data-action="inline-send"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const text = row.querySelector('.write-input')?.value.trim();
    if (text) { sendKeys(paneId, text); showSent(row); }
  });

  row.querySelector('.write-input')?.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = e.target.value.trim();
      if (text) { sendKeys(paneId, text); showSent(row); }
    }
  });
}

function showSent(row) {
  const card = row.querySelector('.response-card');
  if (card) card.innerHTML = '<div class="sent-indicator">✓ Enviado</div>';
  setTimeout(() => { state.expandedPane = null; state.selectedPane = null; renderList(); }, 1000);
}

function updateBottomBar() {
  // bottom bar removed — no-op
}

// ── Bottom bar ──────────────────────────────────────
// bottom bar event listeners removed (HTML was removed)

// ── Blink + timers ──────────────────────────────────
setInterval(() => document.body.classList.toggle('blink-dim'), 1500);
setInterval(() => {
  document.querySelectorAll('.agent-time').forEach(el => {
    const row = el.closest('.agent-row');
    if (!row) return;
    const ag = findAgent(row.dataset.pane);
    if (ag) el.textContent = elapsed(ag.agent.interactionStartedAt);
  });
}, 30000);

// ── Init ────────────────────────────────────────────
connect();
setTimeout(() => {
  if (!state.connected && !state.data.fronts?.length) {
    state.data = DEMO_DATA;
    renderList();
  }
}, 2000);
</script>
</body>
</html>
